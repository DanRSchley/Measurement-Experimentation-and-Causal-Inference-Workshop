name: Render and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Fail fast (before the slow R render) if cross-references are stale or broken:
      # unresolved {{< ref >}} ids, duplicate heading ids, titles whose Part/Module
      # numbers disagree with the chapter order in _quarto.yml, or hard-coded "Part N".
      # To fix numbering locally run:  python tools/check_refs.py --fix
      - name: Check cross-references
        run: python3 tools/check_refs.py

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::broom
            any::knitr
            any::patchwork
            any::lavaan
            any::semTools
            any::psych
            any::mclust
            any::MatchIt
            any::WeightIt
            any::cobalt
            any::rdrobust
            any::rddensity
            any::did
            any::mediation
            any::robmed
            any::estimatr
            any::sandwich
            any::lmtest
            any::conflicted
            any::corrplot
            any::dbscan
            any::AER
            any::MASS
            any::scales
            any::tidytext
            any::topicmodels
            any::reshape2
            any::gridExtra
            any::remotes

      - name: Install GitHub packages
        run: |
          remotes::install_github("synth-inference/synthdid")
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The freeze: auto setting means already-frozen outputs are used.
      # Only chapters whose source changed since last render will re-execute.
      - name: Render and Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
